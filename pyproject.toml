[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tavernpy"
version = "1.0.0"
description = "Async Python client for the console of a self-hosted A Township Tale server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shadow" }]
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9"]
keywords = ["a township tale", "att", "tavernlib", "console", "websocket", "asyncio"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://github.com/Nyx12012/tavernpy"
Source = "https://github.com/Nyx12012/tavernpy"
Issues = "https://github.com/Nyx12012/tavernpy/issues"
Changelog = "https://github.com/Nyx12012/tavernpy/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools]
packages = ["tavernpy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
